{{- $cur := .RelPermalink }}
<header class="lf-topbar">
  <label for="lf-nav-toggle" class="lf-burger" aria-label="Open menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </label>
  <nav class="lf-tabs" aria-label="Sections">
    {{- range site.Menus.main }}
    {{- $active := hasPrefix $cur .URL }}
    <a href="{{ .URL | absLangURL }}" class="lf-tab{{ if $active }} is-active{{ end }}"{{ if $active }} aria-current="page"{{ end }}>
      {{- if eq .Identifier "posts" }}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h10l4 4v14H5zM14 3v5h5M8 12h8M8 16h8"/></svg>
      {{- else if eq .Identifier "archives" }}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v4H3zM5 8v12h14V8M10 12h4"/></svg>
      {{- else if eq .Identifier "search" }}<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg>
      {{- end }}<span>{{ .Name }}</span></a>
    {{- end }}
  </nav>
</header>
