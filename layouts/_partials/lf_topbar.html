<header class="lf-topbar">
  <label for="lf-nav-toggle" class="lf-burger" aria-label="Open menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </label>
  <div class="lf-crumb">
    {{- if .IsHome }}<span>Home</span>
    {{- else }}
    <a href="{{ "" | absLangURL }}">Home</a>
    {{- with .Parent }}{{ if not .IsHome }}<span class="sep">/</span><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ end }}{{ end }}
    <span class="sep">/</span><span class="here">{{ .Title }}</span>
    {{- end }}
  </div>
  <a class="lf-search-btn" href="{{ "search/" | absLangURL }}" aria-label="Search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg>
    <span>Search</span>
  </a>
</header>
