<script>
  (function () {
    var root = document.documentElement;
    function sync() {
      var dark = root.dataset.theme !== "light";
      document.querySelectorAll(".lf-switch").forEach(function (b) { b.setAttribute("aria-checked", dark ? "true" : "false"); });
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", dark ? "#06080f" : "#f4f6fc");
    }
    document.addEventListener("click", function (e) {
      if (!e.target.closest(".lf-switch")) return;
      root.dataset.theme = root.dataset.theme === "light" ? "dark" : "light";
      try { localStorage.setItem("lf-theme", root.dataset.theme); } catch (err) {}
      sync();
    });
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", sync); else sync();
  })();
</script>
