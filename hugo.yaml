baseURL: https://liyafixes.dev/
languageCode: en-us
title: LiyaFixes
theme: PaperMod
enableRobotsTXT: true
enableEmoji: true

pagination:
  pagerSize: 12

outputs:
  home: [HTML, RSS, JSON]

params:
  env: production
  description: "Practical how-to guides for homelabs, self-hosting, networking and fixing things."
  author: LiyaFixes
  defaultTheme: dark
  disableThemeToggle: true
  ShowShareButtons: false
  socialIcons:
    - name: github
      url: https://github.com/pandaboy6621
    - name: rss
      url: /index.xml
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowWordCount: false
  sidebar:
    avatar: "🔧"
    github:
      user: pandaboy6621
      avatar: https://avatars.githubusercontent.com/u/66539261?v=4
    tagline: "Homelab fixes, self-hosting how-tos and the odd hardware project."
    links:
      - name: RSS feed
        url: /index.xml
  homeInfoParams:
    Title: "LiyaFixes"
    Content: >
      Step-by-step fixes and how-tos from my homelab: Docker, reverse proxies,
      single sign-on, routers, scripts and the odd hardware project.
      Everything here broke at least once so you don't have to find out the hard way.

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40

markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    noClasses: false
    style: monokai
