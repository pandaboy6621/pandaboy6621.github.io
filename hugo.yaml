baseURL: https://liyafixes.dev/
languageCode: en-us
title: LiyaFixes
theme: PaperMod
enableRobotsTXT: true
enableEmoji: true

pagination:
  pagerSize: 10

outputs:
  home: [HTML, RSS, JSON]

params:
  env: production
  description: "Practical how-to guides for homelabs, self-hosting, networking and fixing things."
  author: LiyaFixes
  defaultTheme: auto
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowWordCount: false
  homeInfoParams:
    Title: "LiyaFixes 🔧"
    Content: >
      Step-by-step fixes and how-tos from my homelab: Docker, reverse proxies,
      single sign-on, routers, scripts and the odd hardware project.
      Everything here broke at least once so you don't have to find out the hard way.

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30

markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    noClasses: false
    style: monokai
