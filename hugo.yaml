baseURL: https://liyafixes.dev/
languageCode: en-us
title: LiyaFixes
theme: PaperMod
enableRobotsTXT: true
enableEmoji: true

pagination:
  pagerSize: 12

outputs:
  home: [HTML, RSS, JSON]

params:
  env: production
  description: "Practical how-to guides for homelabs, self-hosting, networking and fixing things."
  author: LiyaFixes
  defaultTheme: dark
  disableThemeToggle: true
  ShowShareButtons: false
  socialIcons:
    - name: github
      url: https://github.com/pandaboy6621
    - name: rss
      url: /index.xml
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowWordCount: false
  hero:
    eyebrow: "// homelab field notes"
    title: "Fixes that"
    highlight: "actually work."
    primaryText: "Read the latest"
    secondaryText: "Browse by tag"
  features:
    - icon: "🐳"
      title: "Docker & self-hosting"
      text: "Compose stacks, upgrades and the weird errors nobody documents."
      url: /tags/docker/
    - icon: "🛡️"
      title: "Security & SSO"
      text: "authentik, CrowdSec and Traefik setups that keep the bad traffic out."
      url: /tags/sso/
    - icon: "🌐"
      title: "Networking"
      text: "Routers, subnets, VPNs and getting devices to see each other."
      url: /tags/networking/
    - icon: "🛠️"
      title: "Scripts & DIY"
      text: "Python helpers, CircuitPython gadgets and terminal one-liners."
      url: /tags/diy/
  homeInfoParams:
    Title: "LiyaFixes"
    Content: >
      Step-by-step fixes and how-tos from my homelab: Docker, reverse proxies,
      single sign-on, routers, scripts and the odd hardware project.
      Everything here broke at least once so you don't have to find out the hard way.

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30

markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    noClasses: false
    style: monokai
